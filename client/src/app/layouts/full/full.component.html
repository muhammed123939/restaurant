<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<mat-sidenav-container
  class="mainWrapper blue_theme light-theme"
  autoFocus
  dir="ltr">

  <!-- Hidden sidenav (kept only for header compatibility) -->
  <mat-sidenav
    #leftsidenav
    class="sidebarNav"
    mode="over"
    [opened]="false"
    style="display:none">

    <div class="flex-layout">
      <app-sidebar
        (toggleMobileNav)="leftsidenav.toggle()"
        [showToggle]="false">
      </app-sidebar>
    </div>

  </mat-sidenav>

  <!-- MAIN CONTENT -->
  <mat-sidenav-content class="contentWrapper">

    <main class="pageWrapper">

      <app-header [drawer]="leftsidenav"></app-header>

      <div class="content-area">
        <router-outlet></router-outlet>
      </div>

    </main>

    <!-- Bottom Navigation -->
    <nav class="mobile-bottom-nav">

      @for (item of navItems; track item) {

      <a
        class="mobile-nav-item"
        [routerLink]="item.route"
        routerLinkActive="active"
        (click)="leftsidenav.close()">

        <i
          class="routeIcon"
          [class]="item.iconName">
        </i>
        
<span>{{ item.displayName | translate }}</span>

      </a>

      }

    </nav>

  </mat-sidenav-content>

</mat-sidenav-container>
